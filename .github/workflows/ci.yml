name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Gate (format, lint, types, tests + coverage)
        run: make check
      - name: Offline demo
        run: make demo
      - name: Quick benchmark smoke run
        run: uv run --frozen python -u scripts/bench.py --quick

  ner:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv python install 3.12
      - name: Install optional spaCy extra and model
        run: make ner-model
      - name: NER integration test and evaluation
        run: |
          uv run --frozen --extra ner pytest tests/integration/test_ner_spacy.py
          uv run --frozen --extra ner python -u scripts/eval_detector.py --docs 500
