[project]
name = "privkit"
version = "0.1.0"
description = "Privacy toolkit for data pipelines: PII detection, format-preserving tokenization (NIST FF1/FF3-1), k-anonymity checks and differentially private aggregation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "privkit contributors" }]
dependencies = [
    "cryptography>=44",
]

[project.optional-dependencies]
# Optional NER. The English model is a separate wheel: `make ner-model`.
ner = ["spacy>=3.8,<3.9"]

[project.scripts]
privkit = "privkit.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privkit"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "scipy>=1.18.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "C4", "PT", "RET", "S", "ANN", "TID"]
ignore = [
    "PLR0913",  # many keyword-only parameters are intentional in the public API
    "PLR2004",  # magic values are fine in checksum / protocol code
    "PLR0912",
    "PLR0915",
    "PLR0911",
    "S311",     # random.Random is used only where documented (seeded tests/demos, sampling bounded contributions)
    "PLR0917",  # internal helpers take several positional args by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLC0415", "S108", "PT018", "PT011"]
"scripts/**" = ["S101", "T201"]
"src/privkit/cli.py" = ["PLC0415"]

[tool.ruff.format]
docstring-code-format = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["privkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\."]
