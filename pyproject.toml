[project]
name = "privkit"
version = "0.1.0"
description = "Privacy toolkit for data pipelines: PII detection, format-preserving tokenization (NIST FF1/FF3-1), k-anonymity checks and differentially private aggregation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "archit2501" }]
dependencies = [
    "cryptography>=44",
    "numpy>=2.1",
]

[project.optional-dependencies]
ner = []

[project.scripts]
privkit = "privkit.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privkit"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "scipy>=1.18.1",
]
